# HarmonyOS 适配补丁：禁用依赖原生二进制(node-pty/Koffi)的插件行。
# 鸿蒙设备无法加载原生 ELF/.node 模块，这些行会直接导致 web 启动崩溃。
- id: subprocess
  disabled: true
- id: sandbox
  disabled: true
- id: bash-sandbox
  disabled: true
# permission-presets 已打 HarmonyOS patch：去 bash shell 依赖改用 fs 沙箱 sandboxMode，
# 对话框权限预设(read-only/workspace-write/danger-full-access)恢复可用。
- id: permission
  disabled: false
# auto 目录选择器要解析 bind host / SSH(依赖被禁用的原生能力)；
# 换 browse 变体,纯 JS 文件浏览,不需要原生模块。
- id: directory-picker
  name: '@deepseek-ai/dsh-host-directory-picker-browse'
# research-plugin 的 research 内核 sidecar 是 node 子进程, 在鸿蒙 exec-mmap 限制下
# 无法监听 7412 变健康; 禁用避免 cordis:include 插件树整体加载失败。
- id: research-plugin
  disabled: true
# 插件市场 dsh-market 重新启用(用户要); 无原生依赖+入口无 boot 期网络调用。
- id: dsh-market
  disabled: false

# 委派子代理路由到 Pro（2026-08-17 实测：preset 的 agentOptions 未生效，子代理落回 flash；
# 需在 profile 层按 id 整行替换才生效；headless 与 web 均已实测）。
# 主循环 flash 便宜,复杂子任务 Pro 原生思考,一次做对省往返。
- id: tool-subagent
  config:
    provider: spawn
    toolName: subagent
    backgroundMode: continuable
    agentOptions:
      provider: deepseek-official
      model: deepseek-v4-pro
      maxTokens: 384000
# 挂载 dsh-schedule 定时调度函数插件（随 dsh 基础安装自带）——
# harmony-chat-ops 常驻任务管家预设的 schedule_create/list/delete 依赖它。
- insert:
    - id: schedule
      name: '@deepseek-ai/dsh-schedule'

